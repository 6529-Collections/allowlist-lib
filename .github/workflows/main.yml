name: Allowlist Ci

on:
  push:
    branches:
      - main

env:
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

jobs:
  package-node18:
    name: Package compatibility (Node 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Verify npm package
        run: npm run test:package

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm run audit
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Verify release automation
        run: node --test scripts/ci-release.test.cjs
      - name: Verify npm package
        run: npm run test:package
      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand
      - name: Notify about failure
        uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "allowlist-lib CI pipeline is broken!!!"
          content: "@everyone"
          color: 0xff0000
      - name: Notify about success
        uses: sarisia/actions-status-discord@v1
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "allowlist-lib CI pipeline is OK"
          color: 0x00ff00
