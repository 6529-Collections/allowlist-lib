name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11
      - name: Prepare or resume release version
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: node scripts/ci-release.cjs prepare
      - name: Install dependencies
        if: steps.release.outputs.published != 'true'
        run: |
          npm ci
          # npm rewrites yarn.lock on Linux even during ci; keep the committed Yarn lock.
          git restore --worktree -- yarn.lock
      - name: Audit, test, and verify package
        if: steps.release.outputs.published != 'true'
        run: |
          node --test scripts/ci-release.test.cjs
          npm run audit
          npm test -- --runInBand
          npm run test:package
      - name: Commit release version to main
        if: steps.release.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_RETRY: ${{ steps.release.outputs.retry }}
        run: node scripts/ci-release.cjs commit
      - name: Publish to npm
        if: steps.release.outputs.published != 'true'
        run: npm publish --access=public --registry=https://registry.npmjs.org/
